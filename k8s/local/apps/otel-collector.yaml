apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.178.2"
    helm:
      valuesObject:
        mode: daemonset
        image:
          repository: otel/opentelemetry-collector-k8s
        presets:
          logsCollection:
            enabled: true          # lee los logs de los pods del nodo
          kubernetesAttributes:
            enabled: true          # agrega pod, namespace y nodo a cada dato
        config:
          exporters:
            otlphttp/loki:
              endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
            otlp/tempo:
              endpoint: tempo.monitoring.svc.cluster.local:4317
              tls:
                insecure: true     # dentro del cluster, sin TLS
          service:
            pipelines:
              logs:
                exporters: [otlphttp/loki]
              traces:
                exporters: [otlp/tempo]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
